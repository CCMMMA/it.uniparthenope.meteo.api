[uwsgi]
module = wsgi
http = :5000

master = true
# processes = 32
processes = 8

#socket = /tmp/ccmmmaapi.sock
#chmod-socket = 666
socket-timeout = 300
http-timeout = 300
harakiri = 300

enable-threads = true
die-on-term = true
single-interpreter = true
harakiri-verbose = true
vacuum = true

env = CCMMMAAPI_SETTINGS=/project/etc/ccmmmaapi.conf
