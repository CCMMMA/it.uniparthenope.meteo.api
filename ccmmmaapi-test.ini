[uwsgi]
module = wsgi
http = :5001

master = true
processes = 8
#processes = 8

#socket = /tmp/ccmmmaapi.sock
#chmod-socket = 666
socket-timeout = 300
http-timeout = 300
harakiri = 300

enable-threads = true
die-on-term = true
single-interpreter = true
harakiri-verbose = true
vacuum = true

#req-logger = file:/home/ccmmma/var/log/uwsgi/req-log/req.log
#logger = file:/home/ccmmma/var/log/uwsgi/err-log/app.log
#log-maxsize = 10000000
#log-backupname = file:/home/ccmmma/var/log/uwsgi/backup-log/backup.log

env = CCMMMAAPI_SETTINGS=/project/etc/ccmmmaapi.conf
